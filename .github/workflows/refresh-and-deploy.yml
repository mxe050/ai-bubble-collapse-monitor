name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache global comparison source data
        uses: actions/cache@v4
        with:
          path: data/cache/global-comparison
          key: global-comparison-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            global-comparison-${{ runner.os }}-
      - name: Retrieve market, financial, and credit data
        run: python scripts/update_data.py

      - name: Check browser logic syntax
        run: |
          node --check app.js
          node --check global-comparison.js

      - name: Validate calculations and audited inputs
        run: python scripts/validate_data.py

      - name: Run UI calculation smoke test
        run: node scripts/smoke_ui.js

      - name: Test six-series comparison
        run: node scripts/test_global_comparison.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

