name: Refresh live intelligence and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile scripts/live_intelligence.py scripts/validate_live_data.py

      - name: Check browser logic syntax
        run: |
          node --check app.js
          node --check global-comparison.js

      - name: Refresh live intelligence
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          LIVE_PREVIOUS_URL: https://mxe050.github.io/ai-bubble-collapse-monitor/data/live-intelligence.json
        run: python scripts/live_intelligence.py

      - name: Validate live data
        run: python scripts/validate_live_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '__pycache__/' \
            --exclude '.update-data.*.log' \
            ./ _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
